# DataSource - H2 em memória, sem necessidade de PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate não tenta criar/validar schema (evita conflitos com H2 e migrações PostgreSQL)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Flyway desabilitado (migrações usam SQL específico do PostgreSQL)
spring.flyway.enabled=false

# JWT - valor fixo para testes
api.security.token.secret=test-secret-key-for-context-tests-only

# Reduz verbosidade nos testes
logging.level.root=WARN
logging.level.com.example.java_league=INFO
